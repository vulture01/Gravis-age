<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1233" />

    <title>Gravis Agency — Grow your brand.</title>
    <meta
      name="description"
      content="Gravis Agency is a digital marketing agency helping businesses build a stronger digital presence through social media management, paid advertising, SEO and analytics."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.gravisagency.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gravis Agency" />
    <meta property="og:title" content="Gravis Agency — Grow your brand." />
    <meta
      property="og:description"
      content="We help businesses build a stronger digital presence, reach the right audience, and grow through strategic digital marketing."
    />
    <meta property="og:image" content="/gravis-logo-black.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gravis Agency — Grow your brand." />
    <meta
      name="twitter:description"
      content="We help businesses build a stronger digital presence, reach the right audience, and grow through strategic digital marketing."
    />

    <!-- Brand type: Clash Display (headlines) + Satoshi (body) via Fontshare -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
